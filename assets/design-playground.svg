<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08080C"/><stop offset=".5" stop-color="#12121C"/><stop offset="1" stop-color="#09090E"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#8B5CF6" stop-opacity=".42"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<circle cx="230" cy="150" r="230" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="990" cy="390" r="210" fill="#22D3EE" fill-opacity=".08" filter="url(#blur)"/>

<text x="70" y="72" fill="#A78BFA" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="4">DESIGN PLAYGROUND / 001</text>
<text x="70" y="112" fill="#FFF" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800">From wireframe → interface → experience.</text>
<text x="70" y="143" fill="#A1A1AA" font-family="Arial,Helvetica,sans-serif" font-size="16">A tiny motion study for a UI designer's portfolio.</text>

<!-- floating design card -->
<g filter="url(#shadow)">
  <rect x="610" y="105" width="460" height="330" rx="28" fill="url(#panel)" stroke="#FFF" stroke-opacity=".14"/>
  <rect x="635" y="130" width="410" height="46" rx="14" fill="#000" fill-opacity=".22"/>
  <circle cx="660" cy="153" r="6" fill="#8B5CF6"/>
  <circle cx="682" cy="153" r="6" fill="#22D3EE"/>
  <circle cx="704" cy="153" r="6" fill="#FFF" fill-opacity=".35"/>
</g>

<!-- animated hero orb -->
<circle cx="835" cy="275" r="68" fill="#8B5CF6" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".55">
  <animate attributeName="r" values="62;76;62" dur="3.2s" repeatCount="indefinite"/>
  <animate attributeName="fill-opacity" values=".10;.22;.10" dur="3.2s" repeatCount="indefinite"/>
</circle>
<circle cx="835" cy="275" r="28" fill="#8B5CF6" fill-opacity=".72">
  <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="3.2s" repeatCount="indefinite"/>
</circle>

<!-- animated UI chips -->
<g>
  <rect x="665" y="360" width="105" height="38" rx="19" fill="#FFF" fill-opacity=".08" stroke="#FFF" stroke-opacity=".12">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="718" y="385" text-anchor="middle" fill="#E4E4E7" font-family="Arial" font-size="13">CLARITY</text>
  <rect x="785" y="360" width="105" height="38" rx="19" fill="#FFF" fill-opacity=".08" stroke="#FFF" stroke-opacity=".12">
    <animateTransform attributeName="transform" type="translate" values="0 -6;0 0;0 -6" dur="2.9s" repeatCount="indefinite"/>
  </rect>
  <text x="838" y="385" text-anchor="middle" fill="#E4E4E7" font-family="Arial" font-size="13">MOTION</text>
  <rect x="905" y="360" width="105" height="38" rx="19" fill="#FFF" fill-opacity=".08" stroke="#FFF" stroke-opacity=".12">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="958" y="385" text-anchor="middle" fill="#E4E4E7" font-family="Arial" font-size="13">DETAIL</text>
</g>

<!-- wireframe → final morph-like sequence -->
<g transform="translate(95 205)">
  <rect width="400" height="220" rx="24" fill="#FFF" fill-opacity=".035" stroke="#FFF" stroke-opacity=".12"/>
  <text x="28" y="38" fill="#71717A" font-family="Arial" font-size="13" letter-spacing="2">PROCESS</text>
  <rect x="28" y="65" width="145" height="12" rx="6" fill="#FFF" fill-opacity=".18">
    <animate attributeName="width" values="145;210;145" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="28" y="95" width="315" height="7" rx="3" fill="#FFF" fill-opacity=".08"/>
  <rect x="28" y="113" width="260" height="7" rx="3" fill="#FFF" fill-opacity=".08"/>
  <rect x="28" y="150" width="110" height="42" rx="14" fill="#8B5CF6" fill-opacity=".18" stroke="#A78BFA" stroke-opacity=".35">
    <animate attributeName="fill-opacity" values=".12;.28;.12" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="154" y="150" width="110" height="42" rx="14" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".25">
    <animate attributeName="fill-opacity" values=".08;.20;.08" dur="2.7s" repeatCount="indefinite"/>
  </rect>
  <text x="83" y="176" text-anchor="middle" fill="#D4D4D8" font-family="Arial" font-size="12">EXPLORE</text>
  <text x="209" y="176" text-anchor="middle" fill="#D4D4D8" font-family="Arial" font-size="12">CREATE</text>
</g>

<text x="70" y="485" fill="#52525B" font-family="Arial,Helvetica,sans-serif" font-size="13">OBSERVE • SIMPLIFY • DESIGN • PROTOTYPE • TEST • REFINE</text>
</svg>