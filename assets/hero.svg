<text x="70" y="510" fill="#6B6B6B" font-family="Arial" font-size="12" letter-spacing="2">ATS ELGI EX-INTERN • UI/UX USING FIGMA • RECIPE FINDER • COMPANY CHATBOT</text>
</svg>